{% extends "base_intranet.html" %}

{% block main_content %}
<div class="container">
    <!-- UD4.2.c: El contexto contiene form, object, entity_name y list_url_name.
         La vista de actualización añade delete_url_name para mostrar el borrado solo al actualizar. -->
    <h1>{% if object %}Actualizar{% else %}Crear{% endif %} {{ entity_name }}</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">{% if object %}Actualizar{% else %}Crear{% endif %}</button>
        {% if object and delete_url_name %}
            <a href="{% url delete_url_name pk=object.pk %}" class="btn btn-danger">Eliminar {{ entity_name }}</a>
        {% endif %}
        <a href="{% url list_url_name %}" class="btn btn-secondary">Cancelar</a>
        
    </form>
</div>
{% endblock main_content %}
