{% extends "base_intranet.html" %}

{% block main_content %}
<div class="container">
    <h1>Rutinas</h1>
    <ul class="list-group mt-3">
        {% for rutina in object_list %}
            <li class="list-group-item">{{ rutina.nombre }}</li>
        {% empty %}
            <li class="list-group-item">No hay rutinas registradas.</li>
        {% endfor %}
    </ul>
    {% include "pagination.html" %}
</div>
{% endblock main_content %}
