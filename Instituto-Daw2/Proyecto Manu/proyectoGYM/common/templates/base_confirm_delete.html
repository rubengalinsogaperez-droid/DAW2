{% extends "base_intranet.html" %}

{% block main_content %}
<div class="container">
    <!-- UD4.2.e: El título y el mensaje de confirmación llegan desde la vista. -->
    <h2>{{ titulo }}: {{ object }}</h2>
    <p>{{ mensaje_confirmación }}</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Borrar</button>
        <a href="{% url list_url_name %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock main_content %}
