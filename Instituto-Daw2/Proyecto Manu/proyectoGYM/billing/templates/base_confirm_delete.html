{% extends "base_intranet.html" %}

{% block main_content %}
<div class="container">
    <h1>¿Seguro que quieres eliminar {{ object }}?</h1>
    <!--Object es de django y sirve para buscar el nombre del objeto en este caso por su primary key-->
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Borrar</button>
        <a href="{% url list_url_name %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock main_content %}
