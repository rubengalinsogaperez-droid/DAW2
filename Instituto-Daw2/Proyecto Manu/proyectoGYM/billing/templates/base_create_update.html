{% extends "base_intranet.html" %}

{% block main_content %}
<div class="container">
    <h1>{% if object %}Editar{% else %}Crear{% endif %} {{ entity_name }}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="{% url list_url_name %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock main_content %}
