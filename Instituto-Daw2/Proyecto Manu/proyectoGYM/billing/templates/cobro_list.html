{% extends "base_intranet.html" %}


{% block main_content %}
<div class="container">
    <h1>Lista de cobros</h1>
    <a href="{% url 'cobro_create' %}" class="btn btn-primary mt-2">Crear cobro</a>
    <ul class="list-group mt-3">
    {% for cobro in object_list %}
        <a href="{% url 'cobro_detail' cobro.id %}" class="list-group-item list-group-item-action">{{ cobro }}</a>
        <a href="{% url 'cobro_update' pk=cobro.id %}" class="btn btn-primary">Editar cobro</a>
    {% empty %}
        <p>No existen cobros.</p>
    {% endfor %}
    </ul>
    {% include "pagination.html" %}
</div>
{% endblock main_content %}
