<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Factura Flask{% endblock %}</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        background: #f4f7fb;
        color: #1f2937;
      }
      nav {
        background: #0f172a;
        color: white;
        padding: 1rem 2rem;
      }
      nav a {
        color: white;
        margin-right: 1rem;
        text-decoration: none;
      }
      main {
        max-width: 1100px;
        margin: 2rem auto;
        padding: 0 1rem 3rem;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 1rem;
      }
      .card {
        background: white;
        border-radius: 12px;
        padding: 1rem 1.2rem;
        box-shadow: 0 4px 12px rgba(15, 23, 42, .08);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: white;
      }
      th, td {
        border-bottom: 1px solid #dfe7f1;
        padding: 0.75rem;
        text-align: left;
      }
      .error {
        background: #fee2e2;
        border: 1px solid #fca5a5;
        color: #991b1b;
        padding: 0.8rem;
        border-radius: 8px;
        margin-bottom: 1rem;
      }
      form {
        background: white;
        padding: 1rem;
        border-radius: 12px;
      }
      label {
        display: block;
        margin: 0.8rem 0 0.25rem;
        font-weight: bold;
      }
      input, select {
        width: 100%;
        padding: 0.7rem;
        border-radius: 7px;
        border: 1px solid #cbd5e1;
        box-sizing: border-box;
      }
      button {
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 0.8rem 1rem;
        cursor: pointer;
        margin-top: 1rem;
      }
      .badge {
        display: inline-block;
        padding: 0.3rem 0.6rem;
        border-radius: 999px;
        font-size: 0.8rem;
        font-weight: bold;
      }
      .badge-pendiente { background: #fde68a; color: #78350f; }
      .badge-parcial { background: #bfdbfe; color: #1d4ed8; }
      .badge-pagada { background: #bbf7d0; color: #166534; }
      .message.success {
        background: #d1fae5;
        border: 1px solid #10b981;
        color: #065f46;
        padding: 0.8rem;
        border-radius: 8px;
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="{{ url_for('index') }}">Inicio</a>
      <a href="{{ url_for('clientes_view') }}">Clientes</a>
      <a href="{{ url_for('clientes_buscar_view') }}">Buscar Clientes</a>
      <a href="{{ url_for('facturas_view') }}">Facturas</a>
      <a href="{{ url_for('cobros_view') }}">Cobros</a>
      <a href="{{ url_for('reset_demo') }}">Reiniciar datos</a>
    </nav>

    <main>
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
