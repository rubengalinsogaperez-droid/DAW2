# Configuración de Nginx para la práctica 2.2

# Grupo de servidores de aplicaciones (backends). Por defecto: round robin.
# "resolve" vuelve a preguntar al DNS de Docker si un contenedor se recrea con otra IP.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream backends {
    zone backends 64k;
    server app1:3000 resolve max_fails=1 fail_timeout=10s;
    server app2:3000 resolve max_fails=1 fail_timeout=10s;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    # Compresión: la hace el servidor web, sin tocar la aplicación
    gzip on;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json;

    # Contenido estático
    location / {
        index index.html;
        add_header Cache-Control "no-cache";
    }

    # Ficheros con hash en el nombre (cache busting): se pueden cachear "para siempre"
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Contenido dinámico: se reenvía a los servidores de aplicaciones (proxy inverso)
    location /api/ {
        proxy_pass http://backends;
        proxy_connect_timeout 1s;
        proxy_read_timeout 3s;
        # Si un backend falla o no responde a tiempo, se reintenta en el otro
        proxy_next_upstream error timeout;
        add_header X-Backend $upstream_addr always;
    }
}
